name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ESP-IDF Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create placeholder Wi-Fi config
        run: |
          cp main/config/wifi_config.example.h main/config/wifi_config.h
        working-directory: ${{ github.workspace }}

      - name: Run host-side unit tests
        shell: bash
        run: |
          g++ -std=c++17 \
              -I main \
              -I tests/stubs \
              -I $IDF_PATH/components/json/cJSON \
              $IDF_PATH/components/json/cJSON/cJSON.c \
              tests/test_telemetry.cpp \
              -o tests/test_telemetry
          ./tests/test_telemetry
        working-directory: ${{ github.workspace }}

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build
        working-directory: ${{ github.workspace }}
